# Deploys the Cloudflare Worker API (live polling, Redis cache, hybrid search).
# Tests must pass first. After deploy, a smoke test hits /v1/health; on failure the Worker is rolled back.
# If the Cloudflare secrets are not configured yet, the job exits cleanly (the site still works from snapshots).
name: Deploy API worker
on:
  push:
    branches: [main]
    paths: ["worker/**", "shared/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if Cloudflare is not configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping Worker deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
      - name: Deploy
        if: steps.gate.outputs.run == 'true'
        working-directory: worker
        env:
          PAGES_ORIGIN: ${{ vars.PAGES_ORIGIN }}
        run: |
          ORIGIN="${PAGES_ORIGIN:-*}"
          npx --yes wrangler@3 deploy \
            --var "PAGES_ORIGIN:${PAGES_ORIGIN}" \
            --var "ALLOWED_ORIGIN:${ORIGIN}" \
            --var "GH_REPO:${{ github.repository }}"
      - name: Sync secrets (idempotent; only non-empty values are sent)
        if: steps.gate.outputs.run == 'true'
        working-directory: worker
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          node -e '
            const keys = ["UPSTASH_REDIS_REST_URL","UPSTASH_REDIS_REST_TOKEN","GH_DISPATCH_TOKEN"];
            const out = {}; for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));
            console.log("secrets to sync:", Object.keys(out).join(", ") || "(none)");'
          npx --yes wrangler@3 secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Smoke test
        if: steps.gate.outputs.run == 'true'
        env:
          TS_API_BASE: ${{ vars.TS_API_BASE }}
        run: |
          if [ -z "$TS_API_BASE" ]; then echo "::warning::vars.TS_API_BASE not set; skipping smoke test."; exit 0; fi
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 "$TS_API_BASE/v1/health") && echo "$body" | grep -q '"ok":true' && { echo "$body"; exit 0; }
            sleep 10
          done
          echo "::error::health check failed"; exit 1
      - name: Roll back on failure
        if: failure() && steps.gate.outputs.run == 'true'
        working-directory: worker
        run: |
          npx --yes wrangler@3 rollback --message "auto-rollback after failed smoke test (${{ github.sha }})" \
            || echo "::warning::rollback failed; check the Cloudflare dashboard"
