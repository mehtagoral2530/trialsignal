# Every 3 hours: fetch tracked studies from ClinicalTrials.gov and write site/data/*.json.
# This is the fallback that keeps GitHub Pages useful if the Worker or Redis is down.
# Idempotent: when no tracked field changed, nothing is committed and nothing deploys.
# Also triggered by the Worker's daily cron (repository_dispatch) if the snapshot is stale.
name: Snapshot
on:
  schedule:
    - cron: "23 */3 * * *"
  repository_dispatch:
    types: [snapshot]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.snap.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and diff
        id: snap
        run: node scripts/snapshot.mjs
      - name: Commit data (only if it changed)
        if: steps.snap.outputs.changed == 'true'
        run: |
          git config user.name  "trialsignal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && { echo "nothing staged"; exit 0; }
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
  # Commits made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly.
  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
