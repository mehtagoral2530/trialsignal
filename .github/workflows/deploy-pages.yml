# Builds the static site and publishes it to GitHub Pages.
# Triggered by code changes on main, by the snapshot workflow (workflow_call), or by hand.
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["app/**", "site/**", "shared/**", "scripts/**", ".github/workflows/deploy-pages.yml"]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Never cancel a deploy half-way; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a workflow_call from the snapshot job must see the commit it just pushed
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          TS_API_BASE: ${{ vars.TS_API_BASE }}
        run: |
          node scripts/seed-index.mjs
          node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
