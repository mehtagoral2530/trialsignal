name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every script parses
        run: for f in site/js/*.js site/js/views/*.js site/data/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test
